<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Illustration: a conversational AI interface connecting a home search with a real estate professional">
  <title>Illustration: a conversational AI interface connecting a home search with a real estate professional</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#151d45"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.8" cy="0.1" r="0.4">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bubbleAi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>
  <rect width="1200" height="675" fill="url(#glowB)"/>
  <rect width="1200" height="675" fill="url(#glowC)"/>

  <!-- Skyline with a highlighted home -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round">
    <path d="M40 600V430h70v170M110 600V380h60v220M170 600V455h55v145M225 600V350h80v250M305 600V470h50v130"/>
    <path d="M60 455h30M60 490h30M60 525h30M130 410h20M130 445h20M130 480h20M245 380h40M245 415h40M245 450h40M245 485h40"/>
  </g>
  <g fill="none" stroke="url(#brand)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M370 600V500l70-58 70 58v100"/>
    <path d="M420 600v-48h40v48"/>
  </g>
  <path d="M20 600H560" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Conversation history cards (continuity) -->
  <rect x="575" y="120" width="380" height="410" rx="26" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="555" y="140" width="380" height="410" rx="26" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Chat window -->
  <rect x="530" y="160" width="390" height="420" rx="26" fill="#0f1733" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.18"/>
  <path d="M530 214h390" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="560" cy="187" r="6" fill="#f87171" fill-opacity="0.8"/>
  <circle cx="580" cy="187" r="6" fill="#fbbf24" fill-opacity="0.8"/>
  <circle cx="600" cy="187" r="6" fill="#34d399" fill-opacity="0.8"/>
  <rect x="640" y="181" width="140" height="12" rx="6" fill="#ffffff" fill-opacity="0.18"/>

  <!-- AI bubble -->
  <rect x="555" y="240" width="250" height="70" rx="18" fill="url(#bubbleAi)"/>
  <rect x="577" y="260" width="190" height="10" rx="5" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="577" y="282" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
  <path d="M800 236l6-14 6 14 14 6-14 6-6 14-6-14-14-6z" fill="#e0e7ff"/>

  <!-- User bubble -->
  <rect x="660" y="330" width="235" height="56" rx="18" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="682" y="350" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="682" y="368" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Property card inside AI reply -->
  <rect x="555" y="405" width="270" height="96" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.45"/>
  <rect x="571" y="421" width="84" height="64" rx="10" fill="#22d3ee" fill-opacity="0.18"/>
  <path d="M590 470v-20l23-18 23 18v20z" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linejoin="round"/>
  <rect x="670" y="428" width="130" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="670" y="448" width="95" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="670" y="466" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Typing indicator -->
  <rect x="555" y="520" width="82" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="578" cy="538" r="5" fill="#c7d2fe"/>
  <circle cx="596" cy="538" r="5" fill="#c7d2fe" fill-opacity="0.7"/>
  <circle cx="614" cy="538" r="5" fill="#c7d2fe" fill-opacity="0.4"/>

  <!-- Handoff to a professional -->
  <path d="M920 360C980 360 990 300 1050 300" fill="none" stroke="url(#brand)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle cx="1090" cy="300" r="54" fill="#0f1733" stroke="url(#brand)" stroke-width="3"/>
  <circle cx="1090" cy="285" r="15" fill="none" stroke="#e0e7ff" stroke-width="3"/>
  <path d="M1062 326c6-15 17-22 28-22s22 7 28 22" fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1128" cy="258" r="15" fill="#10b981"/>
  <path d="M1121 258l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Context nodes -->
  <g fill="#818cf8">
    <circle cx="1010" cy="470" r="7"/>
    <circle cx="1080" cy="520" r="5" fill="#22d3ee"/>
    <circle cx="1140" cy="455" r="6" fill="#c084fc"/>
  </g>
  <path d="M920 470h83M1017 470l57 46M1086 518l49-58" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
</svg>
